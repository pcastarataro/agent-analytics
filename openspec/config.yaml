# openspec/config.yaml — SDD configuration for agent-analytics
schema: spec-driven

context: |
  Product: analytics platform for OpenCode agents/skills usage (collector plugin -> UsageEvent contract -> HTTP API -> PostgreSQL -> React dashboard).
  Tech stack: TypeScript 5.9 strict mode, Node.js 20+, React 18, Express 4, Drizzle ORM 0.39, PostgreSQL 16, Zod 4.
  Layout: pnpm monorepo — apps/api, apps/dashboard, packages/{opencode-collector,event-schema,database,shared}.
  Testing: Jest 29 + SWC (API, database, event-schema, shared, opencode-collector), Vitest 2 + Testing Library + jsdom (dashboard).
  Database: PostgreSQL 16 via Drizzle ORM; repository layer abstracts access; domain MUST stay engine-agnostic.
  Architecture: Clean Architecture; domain/infrastructure separation; pure functions; explicit DTOs; no `any`; minimal comments.
  Session preflight: execution_mode=auto; artifact_store=openspec; delivery_strategy=ask-on-risk; review_budget_lines=400.

rules:
  proposal:
    - Include rollback plan for risky changes
    - ask-on-risk delivery: only surface decisions to the user when risk is real; state defaults otherwise
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - UsageEvent contract changes require backward-compatibility analysis (collector <-> API coupling)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Database access designs MUST show how domain stays independent of PostgreSQL vs MySQL
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Keep each review slice within the 400-line review budget; split beyond it (see chained-pr)
  apply:
    guidelines:
      - Follow existing code patterns
      - TypeScript strict mode; no `any`; explicit DTOs; minimal comments
      - Domain layer MUST NOT import from infrastructure (apps, drivers, DB clients)
    tdd: true
    test_command: "pnpm -r test"
  verify:
    test_command: "pnpm -r test"
    build_command: "pnpm -r build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  reason: "Jest 29 (API, packages) and Vitest 2 (dashboard) installed; 18 test files across 6 packages."
  detected: 2026-08-27
  commands:
    test: "pnpm -r test"
    coverage: "jest --coverage"
    lint: "eslint ."
    format_check: "prettier --check ."
    typecheck: "tsc --noEmit"
