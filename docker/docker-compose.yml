services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-analytics-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_analytics
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
