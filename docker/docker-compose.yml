services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-analytics-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_analytics
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agent_analytics']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - '4000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agent_analytics
      PORT: '3000'
      CORS_ORIGINS: http://localhost:5173,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/health']
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
